name: Worker CI

# Typecheck + test the edge API. Path-filtered so app-only changes don't run it.
on:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-ci.yml"

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (offline, deterministic)
        run: npm test
